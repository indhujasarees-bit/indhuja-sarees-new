
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Saree</title>

  <link rel="stylesheet" href="detail.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config.js"></script>

  <style>
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 15px;
      flex-wrap: wrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-cart {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-decoration: none;
      color: inherit;
      font-size: 14px;
      font-weight: bold;
    }

    #headerCartCount {
      background: #8b1e3f;
      color: white;
      border-radius: 50%;
      min-width: 20px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    #wa {
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <a href="./">INDHUJA SAREE'S</a>

  <div class="header-actions">

    <a href="cart.html" class="header-cart">
      🛍️ Cart
      <span id="headerCartCount">0</span>
    </a>

    <a id="wa">WHATSAPP</a>

  </div>
</header>

<main id="product"></main>

<script>
  function updateHeaderCartCount() {
    try {
      const cart = JSON.parse(
        localStorage.getItem("indhuja_cart") || "[]"
      );

      const count = cart.reduce(
        (total, item) => total + Number(item.qty || 1),
        0
      );

      const badge = document.getElementById("headerCartCount");

      if (badge) {
        badge.textContent = count;
      }
    } catch (error) {
      console.log("Cart count error", error);
    }
  }

  updateHeaderCartCount();
</script>

<script src="product.js"></script>

</body>
</html>
