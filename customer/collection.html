
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Collection | Indhuja Saree's</title>

  <link rel="stylesheet" href="detail.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config.js"></script>

  <style>
    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-cart {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-decoration: none;
      color: inherit;
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
    }

    #headerCartCount {
      background: #8b1e3f;
      color: white;
      border-radius: 50%;
      min-width: 20px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 15px;
      flex-wrap: wrap;
    }

    @media(max-width:600px) {
      .header-actions { gap: 8px; }
      .header-cart { font-size: 12px; }
    }

    /* Collection search, sort and mobile-friendly controls */
    .collection-tools {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 220px;
      gap: 12px;
      margin: 22px 0 18px;
    }
    .collection-tools input,
    .collection-tools select {
      width: 100%; min-width: 0; min-height: 46px;
      border: 1px solid #dfd2ca; border-radius: 10px;
      background: #fff; color: #29161e; padding: 12px 14px;
      font: inherit; outline: none;
    }
    .collection-tools input:focus,
    .collection-tools select:focus {
      border-color: #b88a35; box-shadow: 0 0 0 3px #b88a3522;
    }
    #count { color: #78676d; font-size: 13px; margin: 6px 0 14px; }
    @media(max-width:600px) {
      header { padding: 10px 12px; }
      .collection-tools { grid-template-columns: 1fr; gap: 9px; }
      .collection-tools input, .collection-tools select { min-height: 48px; font-size: 16px; }
      main { padding-left: 14px !important; padding-right: 14px !important; }
    }
  </style>
</head>

<body>

<header>
  <a href="./">INDHUJA SAREE'S</a>

  <div class="header-actions">
    <a href="cart.html" class="header-cart">
      🛍️ Cart
      <span id="headerCartCount">0</span>
    </a>

    <a id="wa">WHATSAPP</a>
  </div>
</header>

<div class="hero">
  <i>OUR COLLECTION</i>
  <h1 id="title">Collection</h1>
  <p>Premium sarees from our own manufacturing.</p>
</div>

<main>
  <div class="collection-tools" aria-label="Search and sort sarees">
    <input id="sareeSearch" type="search" placeholder="Search by saree name or code..." aria-label="Search sarees">
    <select id="priceSort" aria-label="Sort sarees by price">
      <option value="default">Sort: Latest first</option>
      <option value="low-high">Price: Low to high</option>
      <option value="high-low">Price: High to low</option>
      <option value="name">Name: A to Z</option>
    </select>
  </div>
  <div id="count" aria-live="polite"></div>
  <div id="grid" class="products"></div>
  <p id="noResults" hidden style="padding:24px;text-align:center;color:#78676d;">No sarees match your search.</p>
</main>

<script src="cart-header.js"></script>
<script src="collection.js"></script>

</body>
</html>
